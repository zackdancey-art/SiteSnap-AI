name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects

    # Postgres for the DB-gated suites (RLS + store round-trip). Without this the
    # TEST_DATABASE_URL-gated tests SKIP, and column drift between a store's SQL
    # and the schema (e.g. crew_timecards start_time/end_time/break_minutes) would
    # sail through green CI and only 500 in prod — the exact failure this guards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitesnap
          POSTGRES_PASSWORD: sitesnap
          POSTGRES_DB: sitesnap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitesnap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Projects/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ONE step. Every gate — shared types, lint, typecheck, the in-memory
      # suite and the DB suite — is defined in Projects/scripts/ci.sh, which is
      # the same program a developer runs locally. Do not add gate steps here:
      # scripts/assert-ci-single-definition.sh (invoked first by ci.sh) fails
      # the build if this file starts running pnpm gates of its own, because a
      # second definition is free to drift from the first and nothing notices.
      - name: CI gate
        run: ./scripts/ci.sh
        env:
          # NODE_ENV=test binds getPgPool() to TEST_DATABASE_URL (never DATABASE_URL).
          # No PG_SSL -> plain local connection to the service container, no TLS.
          # ci.sh HARD FAILS if this is unset while CI=true, rather than letting
          # the DB suites register as skips and the build go green regardless.
          TEST_DATABASE_URL: postgres://sitesnap:sitesnap@localhost:5432/sitesnap_test
